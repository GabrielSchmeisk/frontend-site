<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Produto recomendado | Otimizando o Altar</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e9ecf5;font:16px system-ui,sans-serif;padding:20px;box-sizing:border-box}
    main{width:min(520px,100%);background:#171e2c;padding:32px;border:1px solid #3a4557;border-radius:18px}
    h1{margin-top:0}p{line-height:1.5;color:#b9c3d1}a{color:#f4c430}
  </style>
</head>
<body>
  <main>
    <h1>Preparando seu link</h1>
    <p id="message">Estamos abrindo a recomendação do canal.</p>
    <p><a href="https://www.otimizandooaltar.com/">Voltar para a vitrine</a></p>
  </main>
  <script>
    const slug = new URLSearchParams(location.search).get("produto") || "";
    if (/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug) && slug.length >= 3 && slug.length <= 64) {
      location.replace(`https://otimizando-altar-catalog.assistenciasimplificada.workers.dev/go/${slug}`);
    } else {
      document.querySelector("#message").textContent = "Este endereço de produto é inválido. Confira o link ou veja outras recomendações na vitrine.";
    }
  </script>
</body>
</html>
